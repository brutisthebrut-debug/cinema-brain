name: cinema-brain-horror-sample-review

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum benchmark films to review (keep bounded)
        required: true
        default: "10"
      refresh:
        description: Refresh Wikidata cache
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cinema-brain-horror-sample-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Cinema Brain and tests
        run: pip install -e . && pip install pytest
      - name: Run regression suite
        run: python -m pytest -q
      - name: Rebuild canonical database
        run: python -m cinema_brain --db cinema_brain.db ingest --data-dir data
      - name: Select watched benchmark films
        run: |
          mkdir -p reports
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          benchmark = json.loads(Path("config/golden_horror_v1.json").read_text(encoding="utf-8"))
          requested = [record["film_key"] for record in benchmark["records"]]
          limit = max(1, int("${{ inputs.limit }}"))
          conn = sqlite3.connect("cinema_brain.db")
          try:
              available = {
                  row[0]
                  for row in conn.execute(
                      "SELECT film_key FROM films WHERE watched=1 AND film_key IN (%s)"
                      % ",".join("?" for _ in requested),
                      requested,
                  )
              }
          finally:
              conn.close()
          selected = [key for key in requested if key in available][:limit]
          missing = [key for key in requested if key not in available]
          Path("reports/benchmark_film_keys.txt").write_text(
              "".join(f"{key}\n" for key in selected), encoding="utf-8"
          )
          Path("reports/benchmark_selection.json").write_text(
              json.dumps({"requested": requested, "selected": selected, "missing_from_library": missing}, indent=2),
              encoding="utf-8",
          )
          if not selected:
              raise SystemExit("No watched golden benchmark films were found in the canonical database")
          PY
      - name: Enrich bounded benchmark sample
        id: enrich
        continue-on-error: true
        run: |
          mapfile -t film_keys < reports/benchmark_film_keys.txt
          film_args=()
          for key in "${film_keys[@]}"; do film_args+=(--film-key "$key"); done
          refresh_args=()
          if [ "${{ inputs.refresh }}" = "true" ]; then refresh_args+=(--refresh); fi
          python -m cinema_brain --db cinema_brain.db enrich-metadata \
            "${film_args[@]}" "${refresh_args[@]}" \
            --output reports/horror_sample_enrichment.json
      - name: Extract and persist evidence
        if: always()
        continue-on-error: true
        run: |
          mapfile -t film_keys < reports/benchmark_film_keys.txt
          film_args=()
          for key in "${film_keys[@]}"; do film_args+=(--film-key "$key"); done
          python -m cinema_brain --db cinema_brain.db extract-metadata-evidence \
            "${film_args[@]}" \
            --output reports/horror_sample_evidence.json
      - name: Validate database
        if: always()
        continue-on-error: true
        run: python -m cinema_brain --db cinema_brain.db validate
      - name: Build human review packet
        if: always()
        continue-on-error: true
        run: |
          mapfile -t film_keys < reports/benchmark_film_keys.txt
          film_args=()
          for key in "${film_keys[@]}"; do film_args+=(--film-key "$key"); done
          python -m cinema_brain --db cinema_brain.db sample-review \
            "${film_args[@]}" \
            --output reports/horror_sample_review.json
      - name: Build editable review worksheet
        if: always()
        continue-on-error: true
        run: |
          python -m cinema_brain golden-review-template \
            --benchmark config/golden_horror_v1.json \
            --sample reports/horror_sample_review.json \
            --output reports/golden_horror_review.csv
      - name: Add review instructions and integrity manifest
        if: always()
        run: |
          mkdir -p reports
          cat > reports/REVIEW_INSTRUCTIONS.md <<'EOF'
          # Horror Golden Dataset Review

          This bundle is selected from the versioned golden benchmark, not recent watches.

          1. Open `golden_horror_review.csv`.
          2. For each populated provider result, set `decision` to `approved`, `rejected`, or `quarantined`.
          3. Add a specific `reason` for every decision.
          4. Do not change benchmark identity fields to force a match.
          5. Return the completed CSV for compilation and guarded promotion.

          Approval is valid only when the provider identity remains an exact accepted title and release-year match.
          Individual enrichment failures are diagnostic results and should not prevent review of successful films.
          EOF
          find config reports -type f \( -name 'golden_horror_v1.json' -o -name 'horror_sample_*.json' -o -name 'benchmark_*.json' -o -name 'golden_horror_review.csv' \) \
            -print0 | sort -z | xargs -0 -r sha256sum > reports/SHA256SUMS.txt
          printf '{"enrichment_step_outcome":"%s"}\n' "${{ steps.enrich.outcome }}" > reports/WORKFLOW_STATUS.json
      - name: Upload private review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-brain-horror-review-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: error
          path: |
            config/golden_horror_v1.json
            reports/
            cinema_brain.db
