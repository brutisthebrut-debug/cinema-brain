name: cinema-brain-unwatched-horror-ranking

on:
  workflow_dispatch:
    inputs:
      data_dir:
        description: Letterboxd export and manual data directory
        required: false
        default: data
      output_name:
        description: Artifact name
        required: false
        default: daniel-unwatched-horror-ranking-v1

permissions:
  contents: read

jobs:
  rank-unwatched-horror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Cinema Brain
        run: pip install -e .

      - name: Ingest canonical history
        run: >-
          python -m cinema_brain.cli
          --db cinema_brain.db
          ingest
          --data-dir "${{ inputs.data_dir }}"

      - name: Validate normalized database
        run: python -m cinema_brain.cli --db cinema_brain.db validate

      - name: Generate personal taste graph
        run: >-
          python -m cinema_brain.cli
          --db cinema_brain.db
          personal-taste-graph
          --profiles config/canonical_horror_profiles_v1_reviewed.json
          --output artifacts/personal_taste_graph_v1.json

      - name: Rank eligible unwatched horror candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from cinema_brain.candidate_recommendation_ranking import rank_eligible_candidates_file

          result = rank_eligible_candidates_file(
              Path('config/horror_recommendation_corpus_v1.json'),
              Path('artifacts/personal_taste_graph_v1.json'),
              Path('cinema_brain.db'),
              Path('artifacts/unwatched_horror_ranking_v1.json'),
          )
          print({
              'candidate_count': result['candidate_count'],
              'watched_excluded_count': result['watched_excluded_count'],
              'eligible_count': result['eligible_count'],
              'recommended_count': result['recommended_count'],
              'abstained_count': result['abstained_count'],
          })
          PY

      - name: Verify ranking artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/unwatched_horror_ranking_v1.json')
          result = json.loads(path.read_text(encoding='utf-8'))
          required = {
              'version', 'model_version', 'taste_model_version', 'corpus_version',
              'registry_version', 'candidate_count', 'watched_excluded_count',
              'eligible_count', 'recommended_count', 'abstained_count',
              'watched_exclusions', 'recommendations', 'abstentions'
          }
          missing = required - set(result)
          if missing:
              raise SystemExit(f'missing ranking keys: {sorted(missing)}')
          if result['candidate_count'] != 12:
              raise SystemExit(f"expected 12 frozen candidates, got {result['candidate_count']}")
          if result['eligible_count'] + result['watched_excluded_count'] != result['candidate_count']:
              raise SystemExit('candidate accounting does not reconcile')
          if result['recommended_count'] + result['abstained_count'] != result['eligible_count']:
              raise SystemExit('eligible candidate accounting does not reconcile')
          ranks = [film['recommendation_rank'] for film in result['recommendations']]
          if ranks != list(range(1, len(ranks) + 1)):
              raise SystemExit(f'non-contiguous recommendation ranks: {ranks}')
          print(json.dumps({
              'top_recommendation': result['recommendations'][0]['title'] if result['recommendations'] else None,
              'recommended_count': result['recommended_count'],
              'abstained_count': result['abstained_count'],
              'watched_excluded_count': result['watched_excluded_count'],
          }, indent=2))
          PY

      - name: Upload private recommendation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: |
            artifacts/personal_taste_graph_v1.json
            artifacts/unwatched_horror_ranking_v1.json
          if-no-files-found: error
          retention-days: 30
