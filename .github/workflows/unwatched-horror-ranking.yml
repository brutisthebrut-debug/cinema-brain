name: cinema-brain-unwatched-horror-ranking

on:
  workflow_dispatch:
    inputs:
      data_dir:
        description: Letterboxd export and manual data directory
        required: false
        default: data
      output_name:
        description: Artifact name
        required: false
        default: daniel-unwatched-horror-ranking-v1

permissions:
  contents: read

jobs:
  rank-unwatched-horror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Cinema Brain
        run: pip install -e .

      - name: Ingest canonical history
        run: >-
          python -m cinema_brain.cli
          --db cinema_brain.db
          ingest
          --data-dir "${{ inputs.data_dir }}"

      - name: Validate normalized database
        run: python -m cinema_brain.cli --db cinema_brain.db validate

      - name: Generate personal taste graph
        run: >-
          python -m cinema_brain.cli
          --db cinema_brain.db
          personal-taste-graph
          --profiles config/canonical_horror_profiles_v1_reviewed.json
          --output artifacts/personal_taste_graph_v1.json

      - name: Apply explicit taste preferences
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from cinema_brain.taste_validation import apply_explicit_preferences

          graph_path = Path('artifacts/personal_taste_graph_v1.json')
          preferences_path = Path('config/daniel_explicit_trait_preferences_v1.json')
          graph = json.loads(graph_path.read_text(encoding='utf-8'))
          preferences = json.loads(preferences_path.read_text(encoding='utf-8'))
          result = apply_explicit_preferences(graph, preferences)
          graph_path.write_text(json.dumps(result, indent=2, ensure_ascii=False), encoding='utf-8')
          practical = result['traits']['practical_effects']
          if practical['affinity'] <= 0 or practical.get('status') != 'explicitly_confirmed':
              raise SystemExit('explicit practical-effects preference was not applied')
          PY

      - name: Rank eligible unwatched horror candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from cinema_brain.candidate_recommendation_ranking import rank_eligible_candidates_file

          result = rank_eligible_candidates_file(
              Path('config/horror_recommendation_corpus_v1.json'),
              Path('artifacts/personal_taste_graph_v1.json'),
              Path('cinema_brain.db'),
              Path('artifacts/unwatched_horror_ranking_v1.json'),
          )
          print({
              'candidate_count': result['candidate_count'],
              'watched_excluded_count': result['watched_excluded_count'],
              'eligible_count': result['eligible_count'],
              'recommended_count': result['recommended_count'],
              'abstained_count': result['abstained_count'],
          })
          PY

      - name: Build balanced recommendation slate
        run: |
          python - <<'PY'
          from pathlib import Path
          from cinema_brain.production_balanced_slate import build_production_balanced_slate_file

          result = build_production_balanced_slate_file(
              Path('artifacts/unwatched_horror_ranking_v1.json'),
              Path('artifacts/unwatched_horror_balanced_slate_v1.json'),
              slate_size=5,
          )
          print({
              'balanced_slate_size': len(result['balanced_slate']),
              'discovery_count': result['slate_metrics']['discovery_count'],
              'trait_diversity_ratio': result['slate_metrics']['trait_diversity_ratio'],
          })
          PY

      - name: Build and verify immutable recommendation release
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          from cinema_brain.recommendation_release_gates import (
              verify_recommendation_release_package,
              write_recommendation_release_package,
          )

          generated_at = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          manifest_path, snapshot_path = write_recommendation_release_package(
              Path('artifacts/unwatched_horror_ranking_v1.json'),
              Path('artifacts/unwatched_horror_balanced_slate_v1.json'),
              Path('artifacts'),
              generated_at=generated_at,
              source_revision=os.environ['SOURCE_REVISION'],
              expected_slate_size=5,
          )
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          snapshot = json.loads(snapshot_path.read_text(encoding='utf-8'))
          verify_recommendation_release_package(manifest, snapshot)
          print(json.dumps({
              'release_id': manifest['release_id'],
              'status': manifest['status'],
              'released_predictions': manifest['counts']['released_predictions'],
              'prediction_snapshot_sha256': manifest['prediction_snapshot_sha256'],
          }, indent=2))
          PY

      - name: Build verified recommendation audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from cinema_brain.recommendation_audit import write_recommendation_audit

          audit = write_recommendation_audit(
              Path('artifacts/recommendation_release_manifest_v1.json'),
              Path('artifacts/recommendation_prediction_snapshot_v1.json'),
              Path('artifacts/recommendation_audit_v1.json'),
          )
          print(json.dumps({
              'audit_id': audit['audit_id'],
              'release_id': audit['release_id'],
              'status': audit['status'],
              'gate_pass_ratio': audit['health_metrics']['release_gate_pass_ratio'],
              'evidence_coverage': audit['health_metrics']['explanation_evidence_coverage'],
              'outcome_status': audit['outcome_status']['status'],
          }, indent=2))
          PY

      - name: Package read-only Brain health dashboard
        run: cp tools/brain-health/index.html artifacts/brain_health_dashboard_v1.html

      - name: Upload private recommendation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: |
            artifacts/personal_taste_graph_v1.json
            artifacts/unwatched_horror_ranking_v1.json
            artifacts/unwatched_horror_balanced_slate_v1.json
            artifacts/recommendation_release_manifest_v1.json
            artifacts/recommendation_prediction_snapshot_v1.json
            artifacts/recommendation_audit_v1.json
            artifacts/brain_health_dashboard_v1.html
          if-no-files-found: error
          retention-days: 30
