name: cinema-brain-personal-taste-graph

on:
  workflow_dispatch:
    inputs:
      data_dir:
        description: Letterboxd export and manual data directory
        required: false
        default: data
      output_name:
        description: Artifact bundle name
        required: false
        default: daniel-taste-intelligence-v1

permissions:
  contents: read

jobs:
  build-taste-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Cinema Brain
        run: pip install -e .

      - name: Ingest canonical history
        run: >-
          python -m cinema_brain.cli
          --db cinema_brain.db
          ingest
          --data-dir "${{ inputs.data_dir }}"

      - name: Validate normalized database
        run: python -m cinema_brain.cli --db cinema_brain.db validate

      - name: Generate personal taste graph
        run: >-
          python -m cinema_brain.cli
          --db cinema_brain.db
          personal-taste-graph
          --profiles config/canonical_horror_profiles_v1_reviewed.json
          --output artifacts/personal_taste_graph_v1.json

      - name: Score canonical films
        run: |
          python - <<'PY'
          from pathlib import Path
          from cinema_brain.canonical_taste_scoring import score_canonical_films_file

          score_canonical_films_file(
              Path('config/canonical_horror_profiles_v1_reviewed.json'),
              Path('artifacts/personal_taste_graph_v1.json'),
              Path('artifacts/canonical_film_taste_ranking_v1.json'),
          )
          PY

      - name: Run leave-one-film-out validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from cinema_brain.persisted_taste_signals import load_persisted_signals
          from cinema_brain.taste_validation import leave_one_film_out_validation

          profiles = json.loads(Path('config/canonical_horror_profiles_v1_reviewed.json').read_text(encoding='utf-8'))
          explicit = json.loads(Path('config/daniel_explicit_trait_preferences_v1.json').read_text(encoding='utf-8'))
          signals = load_persisted_signals(Path('cinema_brain.db'), profiles)
          validation = leave_one_film_out_validation(profiles, signals, explicit)
          Path('artifacts/leave_one_film_out_validation_v1.json').write_text(
              json.dumps(validation, indent=2, ensure_ascii=False),
              encoding='utf-8',
          )
          PY

      - name: Verify intelligence artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          graph = json.loads(Path('artifacts/personal_taste_graph_v1.json').read_text(encoding='utf-8'))
          ranking = json.loads(Path('artifacts/canonical_film_taste_ranking_v1.json').read_text(encoding='utf-8'))
          validation = json.loads(Path('artifacts/leave_one_film_out_validation_v1.json').read_text(encoding='utf-8'))

          if graph.get('signal_count', 0) < 1:
              raise SystemExit('no canonical benchmark films matched persisted history')
          if graph.get('learned_trait_count', 0) < 1:
              raise SystemExit('taste graph learned no traits')
          if ranking.get('film_count') != 9:
              raise SystemExit(f"expected 9 ranked films, got {ranking.get('film_count')}")
          ranks = [film.get('rank') for film in ranking.get('films', [])]
          if ranks != list(range(1, 10)):
              raise SystemExit(f'invalid ranking sequence: {ranks}')
          if not any(film.get('active_trait_count', 0) > 0 for film in ranking['films']):
              raise SystemExit('ranking contains no active trait evidence')
          if validation.get('fold_count') != graph.get('signal_count'):
              raise SystemExit(
                  f"held-out fold count {validation.get('fold_count')} does not match signal count {graph.get('signal_count')}"
              )
          if not validation.get('folds'):
              raise SystemExit('held-out validation produced no folds')
          if validation.get('eligible_fold_count', 0) < 1:
              raise SystemExit('held-out validation produced no eligible predictions')
          if any(fold.get('confidence', 0) < 0 or fold.get('trait_coverage', 0) < 0 for fold in validation['folds']):
              raise SystemExit('held-out validation contains invalid confidence or coverage')

          print(json.dumps({
              'signal_count': graph['signal_count'],
              'learned_trait_count': graph['learned_trait_count'],
              'ranked_films': ranking['film_count'],
              'top_film': ranking['films'][0]['title'],
              'top_score': ranking['films'][0]['taste_score'],
              'top_confidence': ranking['films'][0]['confidence'],
              'held_out_folds': validation['fold_count'],
              'eligible_folds': validation['eligible_fold_count'],
              'abstained_folds': validation['abstained_fold_count'],
              'three_way_accuracy': validation['three_way_accuracy'],
              'mean_absolute_error': validation['mean_absolute_error'],
              'single_trait_dominated_folds': validation['single_trait_dominated_fold_count'],
          }, indent=2))
          PY

      - name: Upload private taste intelligence bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}
          path: artifacts/*.json
          if-no-files-found: error
          retention-days: 30
