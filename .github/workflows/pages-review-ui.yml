name: deploy-cinema-brain-review-ui

on:
  push:
    branches: [main]
    paths:
      - 'tools/canonical-review/**'
      - '.github/workflows/pages-review-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload review UI
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/canonical-review

      - name: Deploy review UI
        id: deployment
        uses: actions/deploy-pages@v4
