[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinema-brain"
version = "0.1.0"
description = "A local-first Letterboxd ingestion and recommendation engine"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3"]

[tool.setuptools]
packages = ["cinema_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
