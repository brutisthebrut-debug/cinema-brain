<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema Brain Human Evaluation</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f6f4ee;background:#0d0d0f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#171419,#0d0d0f 42%);min-height:100vh}.shell{max-width:760px;margin:auto;padding:18px}.eyebrow{color:#d7a65a;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.progress,.muted{color:#aaa}.bar{height:5px;background:#29262d;border-radius:99px;overflow:hidden;margin:14px 0 22px}.bar span{display:block;height:100%;background:#d7a65a}.panel{background:#17171b;border:1px solid #2d2a31;border-radius:18px;padding:22px;box-shadow:0 18px 60px #0008}.film{font-size:1.8rem;margin:0}.score{font-size:2.4rem;font-weight:800;color:#d7a65a;margin:12px 0 2px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.box,.reason{background:#111115;border-radius:12px;padding:13px}.label{display:block;color:#918e97;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}.reasons{display:grid;gap:8px;margin:16px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}button,.link{border:1px solid #3a3740;background:#222127;color:#fff;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}.choices button.active{background:#d7a65a;color:#17120b;border-color:#d7a65a}textarea{width:100%;min-height:90px;background:#0f0f12;color:#fff;border:1px solid #39363e;border-radius:10px;padding:11px;font:inherit}.section{margin:20px 0}.nav{display:flex;gap:10px;margin-top:20px}.nav>*{flex:1}.primary{background:#d7a65a;color:#17120b;border-color:#d7a65a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar>*{flex:1;min-width:150px}.status{color:#d7a65a;margin-top:12px}@media(max-width:560px){.grid,.choices{grid-template-columns:1fr}.panel{padding:17px}.toolbar>*{min-width:100%}}
</style></head><body><main class="shell"><div class="top"><div><div class="eyebrow">Cinema Brain Studio</div><strong>Human Evaluation Pack v1</strong></div><div class="progress" id="progress"></div></div><div class="bar"><span id="bar"></span></div><div class="toolbar"><a class="link" href="index.html">Trait review</a><a class="link" href="calibration.html">Taste calibration</a><button id="export">Export evaluation JSON</button><button id="reset">Clear saved answers</button></div><section class="panel" id="panel"></section></main><script>
const template={version:'1.0.0',source_artifact:'daniel-unwatched-horror-ranking-v2',evaluation_type:'frozen_top_five',films:[
{film_key:'title:noroi-the-curse:2005',title:'Noroi: The Curse',year:2005,predicted_score:0.888,predicted_confidence:0.678,drivers:['found footage realism','occult dread','sustained uncertainty','creeping dread'],uncertainty:'The model has limited direct evidence for Japanese documentary-style folk horror.',already_seen:null,interest:null,prediction_reaction:null,watched_after_recommendation:null,actual_rating:null,actual_sentiment:null,would_recommend:null,notes:''},
{film_key:'title:the-dark-and-the-wicked:2020',title:'The Dark and the Wicked',year:2020,predicted_score:0.847,predicted_confidence:0.526,drivers:['creeping dread','isolation','bleak ending','sound-driven tension'],uncertainty:'Confidence is moderate and the prediction leans heavily on dread and isolation.',already_seen:null,interest:null,prediction_reaction:null,watched_after_recommendation:null,actual_rating:null,actual_sentiment:null,would_recommend:null,notes:''},
{film_key:'title:possum:2018',title:'Possum',year:2018,predicted_score:0.785,predicted_confidence:0.413,drivers:['practical effects','psychological destabilization','liminal unease','creeping dread'],uncertainty:'Practical effects is explicit high-confidence evidence, but overall film fit remains less certain.',already_seen:null,interest:null,prediction_reaction:null,watched_after_recommendation:null,actual_rating:null,actual_sentiment:null,would_recommend:null,notes:''},
{film_key:'title:the-empty-man:2020',title:'The Empty Man',year:2020,predicted_score:0.776,predicted_confidence:0.360,drivers:['cosmic dread','slow burn','sustained uncertainty','occult dread'],uncertainty:'The score is strong, but confidence is low because several traits remain sparsely learned.',already_seen:null,interest:null,prediction_reaction:null,watched_after_recommendation:null,actual_rating:null,actual_sentiment:null,would_recommend:null,notes:''},
{film_key:'title:a-dark-song:2016',title:'A Dark Song',year:2016,predicted_score:0.689,predicted_confidence:0.535,drivers:['occult dread','grief','slow burn','isolation'],uncertainty:'The model expects thematic fit, but ritual pacing may determine whether the experience lands.',already_seen:null,interest:null,prediction_reaction:null,watched_after_recommendation:null,actual_rating:null,actual_sentiment:null,would_recommend:null,notes:''}]};
const key='cinema-brain-human-evaluation-v1';let data=JSON.parse(localStorage.getItem(key)||'null')||structuredClone(template),i=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(key,JSON.stringify(data))}function complete(f){return f.already_seen!==null&&f.interest&&f.prediction_reaction}function choice(field,values){const f=data.films[i];return `<div class="choices">${values.map(v=>`<button data-field="${field}" data-value="${v}" class="${String(f[field])===v?'active':''}">${v.replaceAll('_',' ')}</button>`).join('')}</div>`}function render(){const f=data.films[i],done=data.films.filter(complete).length;$('progress').textContent=`${done} of ${data.films.length} reviewed`;$('bar').style.width=`${done/data.films.length*100}%`;$('panel').innerHTML=`<h1 class="film">${esc(f.title)} <span class="muted">(${f.year})</span></h1><div class="score">${Math.round(f.predicted_score*100)}% match</div><div class="muted">Confidence: ${Math.round(f.predicted_confidence*100)}%</div><div class="reasons"><span class="label">Why Cinema Brain chose it</span>${f.drivers.map(x=>`<div class="reason">${esc(x)}</div>`).join('')}</div><div class="box"><span class="label">Known uncertainty</span>${esc(f.uncertainty)}</div><div class="section"><span class="label">Have you already seen it?</span>${choice('already_seen',['true','false'])}</div><div class="section"><span class="label">How interested are you based on this recommendation?</span>${choice('interest',['no','maybe','yes'])}</div><div class="section"><span class="label">Does the explanation sound like you?</span>${choice('prediction_reaction',['wrong','partly_right','nailed_it'])}</div><div class="section"><span class="label">Did you watch it because of this recommendation?</span>${choice('watched_after_recommendation',['not_yet','yes','no'])}</div><div class="section"><span class="label">Actual reaction, when known</span>${choice('actual_sentiment',['dislike','neutral','like','love'])}</div><div class="section"><span class="label">Would you recommend it to someone with similar taste?</span>${choice('would_recommend',['unknown','yes','no'])}</div><div class="section"><label><span class="label">Rating, 0.5–5.0</span><input id="rating" type="number" min="0.5" max="5" step="0.5" value="${f.actual_rating??''}" style="width:100%;background:#0f0f12;color:#fff;border:1px solid #39363e;border-radius:10px;padding:11px;font:inherit"></label></div><div class="section"><label><span class="label">Notes</span><textarea id="notes" placeholder="What worked, what did not, or what the brain misunderstood">${esc(f.notes)}</textarea></label></div><div class="nav"><button id="prev" ${i===0?'disabled':''}>Previous</button><button class="primary" id="next">${i===data.films.length-1?'Finish':'Save & next'}</button></div><div class="status" id="status"></div>`;document.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{let v=b.dataset.value;if(b.dataset.field==='already_seen')v=v==='true';f[b.dataset.field]=v;save();render()});$('prev').onclick=()=>{capture();i--;render()};$('next').onclick=()=>{capture();if(!complete(f)){return $('status').textContent='Answer seen status, interest, and explanation fit before continuing.'}if(i<data.films.length-1){i++;render()}else $('status').textContent='Top five complete. Export the JSON above.'}}
function capture(){const f=data.films[i],r=$('rating'),n=$('notes');if(r)f.actual_rating=r.value?Number(r.value):null;if(n)f.notes=n.value.trim();save()}$('export').onclick=()=>{capture();const missing=data.films.filter(f=>!complete(f));if(missing.length&&!confirm(`${missing.length} films are incomplete. Export anyway?`))return;const out={...data,exported_at:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='daniel_human_evaluation_top5_v1.json';a.click();URL.revokeObjectURL(a.href)};$('reset').onclick=()=>{if(confirm('Clear all locally saved evaluation answers?')){localStorage.removeItem(key);location.reload()}};render();
</script></body></html>
