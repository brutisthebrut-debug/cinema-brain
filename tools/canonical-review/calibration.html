<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinema Brain Taste Calibration</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f6f4ee;background:#0d0d0f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#171419,#0d0d0f 42%);min-height:100vh}.shell{max-width:760px;margin:auto;padding:18px}.eyebrow{color:#d7a65a;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.progress{color:#aaa}.bar{height:5px;background:#29262d;border-radius:99px;overflow:hidden;margin:14px 0 22px}.bar span{display:block;height:100%;background:#d7a65a}.panel{background:#17171b;border:1px solid #2d2a31;border-radius:18px;padding:22px;box-shadow:0 18px 60px #0008}.film{font-size:1.8rem;margin:0 0 8px}.hint{color:#aaa;line-height:1.5}.section{margin:22px 0}.label{display:block;color:#9b98a1;font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;margin-bottom:8px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button,.link{border:1px solid #3a3740;background:#222127;color:#fff;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}.choices button.active{background:#d7a65a;color:#17120b;border-color:#d7a65a}.stars{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.stars button{padding:10px 2px}.trait{background:#111115;border-radius:12px;padding:14px;margin-top:12px}.traitname{font-weight:700;margin-bottom:9px}.trait .choices{grid-template-columns:repeat(4,1fr)}textarea{width:100%;min-height:90px;background:#0f0f12;color:#fff;border:1px solid #39363e;border-radius:10px;padding:11px;font:inherit}.nav{display:flex;gap:10px;margin-top:20px}.nav>*{flex:1}.primary{background:#d7a65a;color:#17120b;border-color:#d7a65a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar>*{flex:1;min-width:155px}.status{color:#d7a65a;margin-top:12px}.done{padding:30px 5px;text-align:center}@media(max-width:560px){.choices,.trait .choices{grid-template-columns:1fr 1fr}.stars{grid-template-columns:repeat(5,1fr)}.panel{padding:17px}.toolbar>*{min-width:100%}}
</style></head><body><main class="shell"><div class="top"><div><div class="eyebrow">Cinema Brain Studio</div><strong>Taste Calibration</strong></div><div class="progress" id="progress"></div></div><div class="bar"><span id="bar"></span></div><div class="toolbar"><a class="link" href="index.html">Trait review</a><button id="export">Export calibration JSON</button><button id="reset">Clear saved answers</button></div><section class="panel" id="panel"></section></main><script>
const template={version:'1.0.0',instructions:'Record overall film enjoyment separately from admiration of individual craft traits. overall_rating uses 0.5-5.0 stars. overall_sentiment uses dislike, neutral, like, or love. trait_reactions use dislike, neutral, like, or admire_not_enjoy.',films:[
{film_key:'title:the-blair-witch-project:1999',title:'The Blair Witch Project',overall_rating:null,overall_sentiment:null,would_rewatch:null,trait_reactions:{},notes:''},{film_key:'title:the-thing:1982',title:'The Thing',overall_rating:null,overall_sentiment:null,would_rewatch:null,trait_reactions:{practical_effects:null},notes:''},{film_key:'title:suspiria:1977',title:'Suspiria',overall_rating:null,overall_sentiment:null,would_rewatch:null,trait_reactions:{},notes:''},{film_key:'title:the-wicker-man:1973',title:'The Wicker Man',overall_rating:null,overall_sentiment:null,would_rewatch:null,trait_reactions:{},notes:''},{film_key:'title:the-fly:1986',title:'The Fly',overall_rating:null,overall_sentiment:null,would_rewatch:null,trait_reactions:{practical_effects:null},notes:''},{film_key:'title:the-ring:2002',title:'The Ring',overall_rating:null,overall_sentiment:null,would_rewatch:null,trait_reactions:{},notes:''},{film_key:'title:let-the-right-one-in:2008',title:'Let the Right One In',overall_rating:null,overall_sentiment:null,would_rewatch:null,trait_reactions:{},notes:''},{film_key:'title:the-host:2006',title:'The Host',overall_rating:null,overall_sentiment:null,would_rewatch:null,trait_reactions:{},notes:''},{film_key:'title:undertone:2025',title:'Undertone',overall_rating:null,overall_sentiment:null,would_rewatch:null,trait_reactions:{},notes:''}]};
const key='cinema-brain-benchmark-calibration-v1';let data=JSON.parse(localStorage.getItem(key)||'null')||structuredClone(template),i=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(key,JSON.stringify(data))}function complete(f){return f.overall_rating!==null&&f.overall_sentiment!==null&&f.would_rewatch!==null&&Object.values(f.trait_reactions).every(Boolean)}function render(){const f=data.films[i],done=data.films.filter(complete).length;$('progress').textContent=`${done} of ${data.films.length} complete`;$('bar').style.width=`${done/data.films.length*100}%`;const stars=Array.from({length:10},(_,n)=>(n+1)/2);$('panel').innerHTML=`<h1 class="film">${esc(f.title)}</h1><p class="hint">Rate the whole movie separately from any craft element you admire.</p><div class="section"><span class="label">Overall rating</span><div class="stars">${stars.map(v=>`<button data-rating="${v}" class="${f.overall_rating===v?'active':''}">${v}</button>`).join('')}</div></div><div class="section"><span class="label">Overall feeling</span><div class="choices">${['dislike','neutral','like','love'].map(v=>`<button data-sentiment="${v}" class="${f.overall_sentiment===v?'active':''}">${v}</button>`).join('')}</div></div><div class="section"><span class="label">Would you rewatch?</span><div class="choices"><button data-rewatch="true" class="${f.would_rewatch===true?'active':''}">Yes</button><button data-rewatch="false" class="${f.would_rewatch===false?'active':''}">No</button></div></div>${Object.keys(f.trait_reactions).map(t=>`<div class="trait"><div class="traitname">${esc(t.replaceAll('_',' '))}</div><div class="choices">${['dislike','neutral','like','admire_not_enjoy'].map(v=>`<button data-trait="${t}" data-value="${v}" class="${f.trait_reactions[t]===v?'active':''}">${v.replaceAll('_',' ')}</button>`).join('')}</div></div>`).join('')}<div class="section"><label><span class="label">Notes</span><textarea id="notes" placeholder="Optional context">${esc(f.notes)}</textarea></label></div><div class="nav"><button id="prev" ${i===0?'disabled':''}>Previous</button><button class="primary" id="next">${i===data.films.length-1?'Finish':'Save & next'}</button></div><div class="status" id="status"></div>`;document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{f.overall_rating=+b.dataset.rating;save();render()});document.querySelectorAll('[data-sentiment]').forEach(b=>b.onclick=()=>{f.overall_sentiment=b.dataset.sentiment;save();render()});document.querySelectorAll('[data-rewatch]').forEach(b=>b.onclick=()=>{f.would_rewatch=b.dataset.rewatch==='true';save();render()});document.querySelectorAll('[data-trait]').forEach(b=>b.onclick=()=>{f.trait_reactions[b.dataset.trait]=b.dataset.value;save();render()});$('prev').onclick=()=>{capture();i--;render()};$('next').onclick=()=>{capture();if(!complete(f)){return $('status').textContent='Complete rating, feeling, rewatch, and any trait reactions.'}if(i<data.films.length-1){i++;render()}else{$('status').textContent='All nine films are ready to export.'}}}
function capture(){const f=data.films[i],n=$('notes');if(n)f.notes=n.value.trim();save()}$('export').onclick=()=>{capture();const missing=data.films.filter(f=>!complete(f));if(missing.length&&!confirm(`${missing.length} films are incomplete. Export anyway?`))return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='daniel_benchmark_reactions_v1_completed.json';a.click();URL.revokeObjectURL(a.href)};$('reset').onclick=()=>{if(confirm('Clear all locally saved calibration answers?')){localStorage.removeItem(key);location.reload()}};render();
</script></body></html>
