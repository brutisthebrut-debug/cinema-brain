<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinema Brain Trait Review</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#f6f4ee;background:#0d0d0f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#171419,#0d0d0f 42%);min-height:100vh}.shell{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.eyebrow{color:#d7a65a;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}.progress{color:#aaa;font-size:.9rem}.bar{height:5px;background:#29262d;border-radius:99px;overflow:hidden;margin:14px 0 24px}.bar span{display:block;height:100%;background:#d7a65a;width:0}.panel{background:#17171b;border:1px solid #2d2a31;border-radius:18px;padding:22px;box-shadow:0 18px 60px #0008}.film{font-size:1.75rem;margin:0}.year{color:#aaa;font-weight:400}.trait{font-size:1.35rem;margin:26px 0 8px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.meta div,.rationale{background:#111115;border-radius:12px;padding:12px}.label{display:block;color:#8f8c95;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}.rationale{line-height:1.5;color:#ddd}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}button,.filelabel{border:1px solid #3a3740;background:#222127;color:#fff;border-radius:12px;padding:13px;font-weight:700;text-align:center;cursor:pointer}.approve.active{background:#23543a}.edit.active{background:#66511f}.reject.active{background:#6b2727}.editor{display:none;gap:12px;margin-top:14px}.editor.show{display:grid}label{font-size:.85rem;color:#bbb}input,textarea{width:100%;margin-top:6px;background:#0f0f12;color:#fff;border:1px solid #39363e;border-radius:10px;padding:11px;font:inherit}textarea{min-height:88px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.nav button{flex:1}.primary{background:#d7a65a;color:#17120b;border-color:#d7a65a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar>*{flex:1;min-width:145px}.empty{text-align:center;padding:42px 15px;color:#bbb}.hint{font-size:.8rem;color:#888;margin-top:10px}.status{margin-top:14px;color:#d7a65a;font-size:.85rem}@media(max-width:540px){.shell{padding:14px}.panel{padding:17px}.film{font-size:1.45rem}.actions{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.toolbar>*{min-width:100%}}
</style>
</head>
<body><main class="shell">
<div class="top"><div><div class="eyebrow">Cinema Brain</div><strong>Canonical Trait Review</strong></div><div class="progress" id="progress">No file loaded</div></div><div class="bar"><span id="bar"></span></div>
<div class="toolbar"><label class="filelabel">Import CSV<input id="file" type="file" accept=".csv,text/csv" hidden></label><button id="export" disabled>Export reviewed CSV</button><button id="reset" disabled>Clear saved review</button></div>
<section class="panel" id="panel"><div class="empty">Import the generated review CSV to begin. Your progress is saved only in this browser.</div></section>
</main>
<script>
const REQUIRED=['film_key','title','year','trait_id','candidate_value','candidate_confidence','source','rationale','decision','reviewed_value','reviewed_confidence','review_note'];
let rows=[],i=0,storageKey='';
const $=id=>document.getElementById(id);
function parseCSV(text){const out=[];let row=[],cell='',q=false;for(let p=0;p<text.length;p++){const c=text[p],n=text[p+1];if(q&&c==='"'&&n==='"'){cell+='"';p++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')p++;row.push(cell);if(row.some(x=>x!==''))out.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x!==''))out.push(row);const h=out.shift().map(x=>x.trim());for(const col of REQUIRED)if(!h.includes(col))throw Error('Missing required column: '+col);return out.map(r=>Object.fromEntries(h.map((k,j)=>[k,r[j]??''])))}
function csvEscape(v){v=String(v??'');return /[",\n\r]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}
function save(){if(storageKey)localStorage.setItem(storageKey,JSON.stringify(rows))}
function decided(){return rows.filter(r=>['approve','reject','edit'].includes(r.decision)).length}
function render(){if(!rows.length)return;const r=rows[i],done=decided();$('progress').textContent=`${done} of ${rows.length} reviewed`;$('bar').style.width=`${done/rows.length*100}%`;const needsEdit=r.decision==='edit',needsNote=needsEdit||r.decision==='reject';$('panel').innerHTML=`
<h1 class="film">${esc(r.title)} <span class="year">(${esc(r.year)})</span></h1><div class="trait">${esc(r.trait_id.replaceAll('_',' '))}</div>
<div class="meta"><div><span class="label">Candidate value</span>${esc(r.candidate_value)}</div><div><span class="label">Confidence</span>${esc(r.candidate_confidence)}</div><div><span class="label">Source</span>${esc(r.source)}</div><div><span class="label">Row</span>${i+1} / ${rows.length}</div></div>
<div class="rationale"><span class="label">Rationale</span>${esc(r.rationale)}</div>
<div class="actions"><button class="approve ${r.decision==='approve'?'active':''}" data-d="approve">Approve</button><button class="edit ${needsEdit?'active':''}" data-d="edit">Edit</button><button class="reject ${r.decision==='reject'?'active':''}" data-d="reject">Reject</button></div>
<div class="editor ${needsEdit?'show':''}" id="editFields"><label>Reviewed value (0–1)<input id="rv" type="number" min="0" max="1" step="0.01" value="${escAttr(r.reviewed_value)}"></label><label>Reviewed confidence (0–1)<input id="rc" type="number" min="0" max="1" step="0.01" value="${escAttr(r.reviewed_confidence)}"></label></div>
<div class="editor ${needsNote?'show':''}" id="noteField"><label>Review note ${needsNote?'(required)':''}<textarea id="note">${esc(r.review_note)}</textarea></label></div>
<div class="nav"><button id="prev" ${i===0?'disabled':''}>Previous</button><button class="primary" id="next">${i===rows.length-1?'Finish':'Save & next'}</button></div><div class="status" id="status"></div>`;
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{r.decision=b.dataset.d;if(r.decision==='approve'){r.reviewed_value='';r.reviewed_confidence='';r.review_note=''}save();render()});$('prev').onclick=()=>{capture(false);i--;render()};$('next').onclick=()=>{if(!capture(true))return;if(i<rows.length-1){i++;render()}else{$('status').textContent=decided()===rows.length?'All rows reviewed. Export the CSV above.':'Some rows still need decisions.'}}}
function capture(validate){const r=rows[i];if($('rv'))r.reviewed_value=$('rv').value.trim();if($('rc'))r.reviewed_confidence=$('rc').value.trim();if($('note'))r.review_note=$('note').value.trim();if(validate){if(!r.decision)return fail('Choose approve, edit, or reject.');if(r.decision==='edit'&&(!valid01(r.reviewed_value)||!valid01(r.reviewed_confidence)||!r.review_note))return fail('Edits require value, confidence, and a note.');if(r.decision==='reject'&&!r.review_note)return fail('Rejections require a note.')}save();return true}
function fail(s){$('status').textContent=s;return false}function valid01(v){return v!==''&&!isNaN(v)&&+v>=0&&+v<=1}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(s){return esc(s)}
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=parseCSV(await f.text());storageKey='cinema-review:'+f.name+':'+parsed.length;const saved=localStorage.getItem(storageKey);rows=saved?JSON.parse(saved):parsed;i=Math.max(0,rows.findIndex(r=>!r.decision));if(i<0)i=0;$('export').disabled=$('reset').disabled=false;render()}catch(err){alert(err.message)}};
$('export').onclick=()=>{if(!capture(true))return;const missing=rows.filter(r=>!['approve','reject','edit'].includes(r.decision));if(missing.length&&!confirm(`There are ${missing.length} unreviewed rows. Export anyway?`))return;const text=[REQUIRED.join(','),...rows.map(r=>REQUIRED.map(k=>csvEscape(r[k])).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download='canonical-horror-profile-review-v1-reviewed.csv';a.click();URL.revokeObjectURL(a.href)};
$('reset').onclick=()=>{if(confirm('Clear locally saved decisions for this worksheet?')){localStorage.removeItem(storageKey);location.reload()}};
</script></body></html>
